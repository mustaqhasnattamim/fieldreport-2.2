<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>মফিজ – চায়ের বিল</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+Bengali:wght@400;700;800&family=Oswald:wght@400;700&display=block">
<style>
:root{--bg:#05070f;--bar:#0B1226;--ink:#EAF0FF;--mut:#8FA0C8;--acc:#FFC93C;--ok:#6EE7A8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans Bengali","Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
#wrap{position:relative;display:flex;align-items:center;justify-content:center;width:100%;background:#000;flex:0 0 auto}
#stage{display:block;background:#000;cursor:pointer;box-shadow:0 0 0 1px rgba(255,255,255,.04)}
#big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(5,7,15,.35)}
#big span{width:112px;height:112px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 40px rgba(0,0,0,.45)}
#big span:after{content:"";margin-left:10px;border-left:38px solid #0B1226;border-top:24px solid transparent;border-bottom:24px solid transparent}
#drop{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(11,18,38,.88);border:4px dashed var(--acc);font-size:28px;font-weight:700;z-index:5;pointer-events:none}
#bar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bar);flex:0 0 auto;min-height:56px;flex-wrap:nowrap}
button,.btn{font:inherit;font-size:14px;font-weight:700;color:var(--ink);background:#1B2748;border:1px solid #2B3B6B;border-radius:8px;padding:8px 14px;cursor:pointer;white-space:nowrap}
button:hover,.btn:hover{background:#26356A}
button:focus-visible,.btn:focus-within,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#bPlay{min-width:84px;background:var(--acc);color:#0B1226;border-color:var(--acc)}
#bPlay:hover{background:#FFD76B}
#rng{flex:1 1 auto;min-width:80px;accent-color:var(--acc);height:24px}
#tTime{font-variant-numeric:tabular-nums;font-size:14px;color:var(--ink);min-width:116px;text-align:center}
label.chk{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink);white-space:nowrap}
.btn input{display:none}
#stat{font-size:12px;color:var(--mut);max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#stat.ok{color:var(--ok)}
@media (max-width:900px){#bar{flex-wrap:wrap;gap:8px}#rng{order:9;flex:1 0 100%}#stat{display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="wrap">
    <canvas id="stage" width="1920" height="1080" aria-label="মফিজ – চায়ের বিল animated explainer"></canvas>
    <div id="big" aria-hidden="true"><span></span></div>
    <div id="drop">Drop the voiceover audio file here</div>
  </div>
  <div id="bar">
    <button id="bPlay" type="button">Play</button>
    <input id="rng" type="range" min="0" max="129840" value="0" aria-label="Scrub">
    <span id="tTime">0:00.0 / 0:00.0</span>
    <button id="bSnd" type="button" aria-pressed="false">Sound on</button>
    <label class="chk"><input id="cLoop" type="checkbox"> Loop</label>
    <label class="btn">Load voiceover<input id="fIn" type="file" accept="audio/*,.wav"></label>
    <button id="bFs" type="button">Fullscreen</button>
    <span id="stat"></span>
  </div>
</div>
<audio id="voice" preload="auto"></audio>

/* =====================================================================
   PLAYER — letterboxed canvas, control bar, audio-as-clock, drag & drop voiceover.
   ===================================================================== */
(function () {
  const $ = id => document.getElementById(id);
  const cv = $('stage'), ctx = cv.getContext('2d');
  const voice = $('voice'), bPlay = $('bPlay'), rng = $('rng'), tTime = $('tTime'), bSnd = $('bSnd'), cLoop = $('cLoop');
  const fIn = $('fIn'), stat = $('stat'), big = $('big'), wrap = $('wrap'), bFs = $('bFs'), drop = $('drop');
  const ST = { T: 0, playing: false, base: 0, at: 0, hasAudio: false, wait: false, sound: true, loop: false, dirty: true, last: -1, scrubWas: false, objUrl: null, started: false };

  const fmt = t => { t = Math.max(0, t); const m = Math.floor(t / 60), s = Math.floor(t % 60), cs = Math.floor((t * 10) % 10); return m + ':' + (s < 10 ? '0' : '') + s + '.' + cs; };

  /* ---------- sizing (letterbox) ---------- */

    const bar = $('bar').offsetHeight || 56; const aw = window.innerWidth, ah = Math.max(80, window.innerHeight - bar);
    let w = aw, h = Math.round(aw * 9 / 16); if (h > ah) { h = ah; w = Math.round(ah * 16 / 9); }
    cv.style.width = w + 'px'; cv.style.height = h + 'px'; wrap.style.height = ah + 'px';

  window.addEventListener('resize', fit); fit();

  /* ---------- drawing ---------- */
  function draw(t) { try { explainer(ctx, cv.width, cv.height, t); } catch (e) { console.error('frame failed', e); } }
  function ui() {
    tTime.textContent = fmt(ST.T) + ' / ' + fmt(DURATION);
    if (!ST.scrubWas || !ST.playing) { if (document.activeElement !== rng || !ST.playing) rng.value = String(Math.round(ST.T * 1000)); }
    bPlay.textContent = ST.playing ? 'Pause' : (ST.T >= DURATION - 0.02 ? 'Replay' : 'Play');
    bPlay.setAttribute('aria-label', bPlay.textContent);
    big.style.display = (ST.playing || ST.started) ? 'none' : 'flex';
  }

  /* ---------- clock ---------- */
  function clock() {
    if (!ST.playing) return ST.T;

  cv.addEventListener('click', toggle);
  rng.addEventListener('pointerdown', () => { ST.scrubWas = ST.playing; pause(); });
  rng.addEventListener('input', () => { seekTo(parseInt(rng.value, 10) / 1000); });
  rng.addEventListener('change', () => { if (ST.scrubWas) { ST.scrubWas = false; play(); } });
  rng.addEventListener('pointerup', () => { if (ST.scrubWas) { ST.scrubWas = false; play(); } });
  bSnd.addEventListener('click', () => setSound(!ST.sound));
  cLoop.addEventListener('change', () => { ST.loop = cLoop.checked; });
  bFs.addEventListener('click', () => { try { if (document.fullscreenElement) document.exitFullscreen(); else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); } catch (e) { } });
  window.addEventListener('keydown', e => {
    if (e.target && /INPUT/.test(e.target.tagName) && e.target.type === 'file') return;
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowRight') seekTo(ST.T + 5); else if (e.code === 'ArrowLeft') seekTo(ST.T - 5);

  window.addEventListener('dragover', e => { e.preventDefault(); });

  window.addEventListener('drop', e => { e.preventDefault(); dragN = 0; drop.style.display = 'none'; const fl = e.dataTransfer && e.dataTransfer.files; if (fl && fl.length) { for (let i = 0; i < fl.length; i++) { if (/^audio\//.test(fl[i].type) || /\.(wav|mp3|m4a|ogg|aac|flac|webm)$/i.test(fl[i].name)) { loadAudioFile(fl[i]); break; } } } });

  const BN_SAMPLE = 'ক্ষ ন্য ট্য ম ফি জ চা য়ে র বি ল অ আ ';
  function redrawAfterFonts() { try { layoutPhrases(); } catch (e) { } ST.dirty = true; try { draw(ST.T); } catch (e) { } }
  let fontsPromise;
  try {
    const want = ['400 40px "Noto Sans Bengali"', '700 40px "Noto Sans Bengali"', '800 40px "Noto Sans Bengali"', '400 40px Anton', '400 40px Oswald', '700 40px Oswald'];
    const loads = want.map(f => document.fonts.load(f, BN_SAMPLE + 'ABC abc 0123456789').catch(() => null));
    const timeout = new Promise(res => setTimeout(res, 2500));
    fontsPromise = Promise.race([Promise.all(loads), timeout]).then(() => document.fonts.ready.catch ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 300))]) : null).then(redrawAfterFonts).catch(redrawAfterFonts);
    if (document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', redrawAfterFonts);
  } catch (e) { fontsPromise = Promise.resolve(); }

  /* ---------- go ---------- */
  setStatus('Looking for voiceover.wav ...', false);
  try { voice.src = 'voiceover.wav'; voice.load(); } catch (e) { }
  setTimeout(() => { if (!ST.hasAudio && !ST.objUrl) setStatus('No voiceover: click "Load voiceover" or drop an audio file here', false); }, 1500);
  draw(0); ui();
  requestAnimationFrame(tick);
  window.__player = ST;
})();
